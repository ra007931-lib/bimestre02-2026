<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Channel | Sowl Digital</title>
  <link href="bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="pagina">
    <section class="container" aria-labelledby="titulo-channel">
      <header class="text-center">
        <h1 id="titulo-channel" class="sowl-titulo mb-3">Siga a <span>Sowl</span> e empodere-se</h1>
        <p class="sowl-descricao">A Sowl Digital desenvolve soluções digitais e conecta pessoas a novas possibilidades. Acompanhe nossos canais, descubra conteúdos, novidades e inspirações para fazer parte dessa comunidade.</p>
      </header>
      <div class="row align-items-center justify-content-center g-3 sowl-conteudo">
        <nav class="col-12 col-md-2 d-flex flex-md-column align-items-center justify-content-center redes" aria-label="Redes sociais">
          <a class="rede-link" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img src="imagens/facebook.png" alt="Ícone do Facebook"></a>
          <a class="rede-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="imagens/instagram.png" alt="Ícone do Instagram"></a>
        </nav>
        <div class="col-12 col-md-8">
          <img class="sowl-foto img-fluid" src="imagens/sowl-channel.jpg" alt="Pessoa sentada segurando um celular com ícones de redes sociais">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
